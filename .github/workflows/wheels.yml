name: Wheels

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # OpenMP is not available with Apple Clang: vendor a libomp in the
      # wheels, built from source so that it works next to the libomp of other
      # wheels (see build_tools/build_macos_libomp.sh). libomp 11, as in
      # scikit-learn's wheels, lacks __kmpc_dispatch_deinit, which recent
      # Apple Clang emits for the dynamic and guided schedules.
      - name: Enable OpenMP with Apple Clang
        if: runner.os == 'macOS'
        run: |
          PREFIX="$RUNNER_TEMP/openmp"
          if [[ "$(uname -m)" == "arm64" ]]; then
            export MACOSX_DEPLOYMENT_TARGET=12.0
          else
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          bash build_tools/build_macos_libomp.sh 23.1.5 "$PREFIX"
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
          echo "CC=/usr/bin/clang" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-Xpreprocessor -fopenmp" >> "$GITHUB_ENV"
          echo "CFLAGS=-I$PREFIX/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-Wl,-rpath,$PREFIX/lib -L$PREFIX/lib -lomp" >> "$GITHUB_ENV"

      - uses: pypa/cibuildwheel@v4.3.5

      - name: Check the libomp vendored in the wheels
        if: runner.os == 'macOS'
        run: bash build_tools/check_macos_libomp.sh wheelhouse/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # The PyTorch wheels for macOS bundle their own libomp: check that ours works
  # next to it. PyTorch has no wheel for the Intel Macs anymore.
  test-macos-pytorch:
    name: Test next to the PyTorch wheel on macOS
    needs: wheels
    runs-on: macos-15
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos-15
          path: wheelhouse
      - run: pip install wheelhouse/*-cp313-*.whl pytest torch
      - run: pytest --pyargs sklearn_emeans.tests.test_openmp_runtimes -v -p no:cacheprovider | tee out.txt
      - run: grep -E "2 passed" out.txt

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    # Needs a trusted publisher on PyPI for this repository, workflow and the
    # "pypi" environment.
    if: github.event_name == 'release'
    needs: [wheels, test-macos-pytorch, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
